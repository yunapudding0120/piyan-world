            animation: bounceFlower 3s infinite ease-in-out;

            "生魚片山葵渣", "章魚燒柴魚片碎", "天婦羅麵衣酥", "壽司海苔碎片", "日式納豆渣",

            "披薩起司焦皮", "美式薯條馬鈴薯皮", "吉事漢堡黃芥末籽", "紐奧良雞翅黑胡椒粒", "燕麥奶燕麥麩皮",
            "黑芝麻湯圓芝麻粒", "白芝麻燒餅籽", "腰果果碎", "核桃微苦外皮", "開心果綠色碎屑", "夏威夷豆碎粒", "杏仁片碎片", "花生湯軟花生渣", "松子碎粒", "葵花子殼渣",
            "芒果纖維絲", "鳳梨酸甜纖維", "甘蔗咀嚼纖維", "橘子白絲絡", "柚子果肉胞粒",
            "柳丁果肉殘渣", "蘋果微脆果皮", "水蜜桃絨毛皮", "葡萄紫紅果皮", "櫻桃果肉碎片",
            "小番茄外皮", "苦瓜薄皮", "青椒小籽", "茄子紫皮", "絲瓜網狀纖維",
            "冬瓜果肉渣", "南瓜子碎片", "芋頭甜湯芋頭泥", "山藥黏液纖維", "蓮藕微孔纖維",
            "黑木耳碎片", "白木耳膠質渣", "香菇傘蓋碎粒", "杏鮑菇纖維絲", "鴻喜菇菌傘",
            "海帶芽碎片", "紫菜湯紫菜碎片", "昆布海藻渣", "羊棲菜細絲", "海苔醬殘渣",
            "皮蛋蛋黃泥", "鹹鴨蛋黃碎粒", "飛魚卵微粒", "明太子薄膜", "鮭魚卵皮",

        // 50+ 種情緒香氣調性詞庫 (前調、中調、後調)
        const AROMA_TOP = ["焦慮不安的", "微醺悲傷的", "雀躍爆發的", "憂鬱暴躁的", "暴怒狂熱的", "傲嬌委屈的", "佛系平靜的", "迷茫興奮的", "慵懶厭世的", "浪漫狂喜的"];
        const AROMA_MID = ["九層塔蒜香", "腐乳起司濃香", "老麻辣花椒香", "日式醬油焦香", "泰式酸辣檸檬香", "黑胡椒奶油香", "紅蔥頭油酥香", "熱帶百香果果香", "濃郁煙燻柴魚香", "松露奶油純香"];
        const AROMA_BASE = ["帶著淡淡的炭焙烏龍餘韻", "伴隨濃烈的九層塔回甘", "散發持久的蒜泥後勁", "拖著迷人的臭豆腐餘香", "交織著微甜的花生粉尾韻", "夾雜著勁爆的青椒後味", "蘊含著沉穩的黑芝麻香味", "流露著甜美的黑糖風味", "隱約浮現經典的當歸溫香", "帶來提神的薄荷清涼尾味"];

        // 50+ 種米其林評語庫
        const MICHELIN_COMMENTS = [
            "這是一道充滿層次感的皮炎藝術作品，整體氣味完美融合，堪稱大自然最震撼的發酵饗宴。",

            "風味強烈且極具侵略性，前調衝擊鼻腔，中調沉穩深邃，後調令人久久無法忘懷。",
            "絕妙的氣味平衡！將情緒調性與微生物代謝產物揉合得天衣無縫，值得三星推薦。",

            "這不僅是皮炎，這是一座活生生的美食博物館，完美保留了食物最原始的精髓。",
            "渾然天成的沉浸式氣味饗宴，深度的掌控恰到好處，帶來無與倫比的視覺與嗅覺震撼。",
            "極具後現代主義風格的皮炎構造成分，各種細節環環相扣，展現出驚人的生命力。",
            "完美呈現了大地發酵的真諦，味道溫潤而富有個性，是不可多得的皮炎奇蹟作品。"
        ];

        // 直徑與深度幽默參照物 (合理化範圍)
        const DIAMETER_REFS = ["約一枚 10 元硬幣大小", "約一枚 50 元硬幣大小", "相當於一顆好吃的章魚燒", "相當於高爾夫球的截面", "約莫是一顆乒乓球大小"];
        const DEPTH_REFS = ["約一支護唇膏的長度", "相當於一根台式小香腸", "約莫是一張信用卡的高度", "約一支標準馬克杯的高度", "相當於一支短鋼筆的長度"];

        // 確定性 Seeded PRNG - cyrb53 Hash 演算法
        function cyrb53(str, seed = 0) {
            let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
            for (let i = 0, ch; i < str.length; i++) {
                ch = str.charCodeAt(i);
                h1 = Math.imul(h1 ^ ch, 2654435761);
                h2 = Math.imul(h2 ^ ch, 1597334677);
            }
            h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
            h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
            return (h2 >>> 0) * 4294967296 + (h1 >>> 0);
        }

        // Mulberry32 偽隨機數產生器
        function mulberry32(a) {
            return function() {
              var t = a += 0x6D2B79F5;
              t = Math.imul(t ^ t >>> 15, t | 1);
              t ^= t + Math.imul(t ^ t >>> 8, t | 31);
              return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        let globalDetectData = null;

        // 探測按鈕觸發主邏輯
        function handleDetect(e) {
            e.preventDefault();
            const name = document.getElementById('userName').value.trim();
            const birthday = document.getElementById('userBirthday').value;

            if (!name || !birthday) return;

            // 1. 生成確定性亂數種子
            const seed = cyrb53(`${name}_${birthday}`);
            const rng = mulberry32(seed);

            // 2. 算定各項數值 (合理化範圍)
            const diameter = (1.2 + rng() * 4.3).toFixed(1); // 1.2 cm ~ 5.5 cm
            const depth = (3.0 + rng() * 9.0).toFixed(1);    // 3.0 cm ~ 12.0 cm

            const diameterRef = DIAMETER_REFS[Math.floor(rng() * DIAMETER_REFS.length)];
            const depthRef = DEPTH_REFS[Math.floor(rng() * DEPTH_REFS.length)];

            // 數值懸殊構造成分
            const snakeKg = (0.2 + rng() * 4.8).toFixed(2); // 0.2 ~ 5.0 kg
            const cellCount = Math.floor(10000000 + rng() * 990000000); // 10,000,000 ~ 1,000,000,000 個
            const foodCount = Math.floor(5 + rng() * 800); // 5 ~ 805 粒

            // 隨機抽題 (100 種食物、前中後調香氣、米其林評語)
            const foodName = FOOD_DATABASE[Math.floor(rng() * FOOD_DATABASE.length)];
            const aroma = `前調帶著【${AROMA_TOP[Math.floor(rng() * AROMA_TOP.length)]}${AROMA_MID[Math.floor(rng() * AROMA_MID.length)]}】，中調綻放【${AROMA_TOP[Math.floor(rng() * AROMA_TOP.length)]}${AROMA_MID[Math.floor(rng() * AROMA_MID.length)]}】，後調則是${AROMA_BASE[Math.floor(rng() * AROMA_BASE.length)]}。`;
            const comment = `“${MICHELIN_COMMENTS[Math.floor(rng() * MICHELIN_COMMENTS.length)]} 尤其是探測到的『${foodName}』，更為整體增添了靈魂樂章！”`;

            // 保存全域資料
            globalDetectData = {
                name, birthday, diameter, depth, diameterRef, depthRef,
                snakeKg, cellCount, foodCount, foodName, aroma, comment
            };

            // 3. 渲染至 DOM
            document.getElementById('resultTitle').innerText = `${name} 的皮炎宇宙`;
            document.getElementById('diameterVal').innerText = `${diameter} cm`;
            document.getElementById('diameterRef').innerText = diameterRef;
            document.getElementById('depthVal').innerText = `${depth} cm`;
            document.getElementById('depthRef').innerText = depthRef;

            document.getElementById('snakeVal').innerText = `${snakeKg} kg`;
            document.getElementById('cellVal').innerText = `${cellCount.toLocaleString()} 個`;
            document.getElementById('foodName').innerText = `🍲 食物殘渣 (${foodName})`;
            document.getElementById('foodVal').innerText = `${foodCount} 粒`;

            // 4. 計算 Log Scale 長條圖寬度 (歸一化轉換，解決懸殊問題)
            const logSnake = Math.log10(parseFloat(snakeKg) * 100 + 1); // scale ~ 1-3
            const logCell = Math.log10(cellCount + 1);                 // scale ~ 7-9
            const logFood = Math.log10(foodCount + 1);                 // scale ~ 1-3

            const maxLog = Math.max(logSnake, logCell, logFood);
            
            // 保持一定視覺最低條長 (最少 15%)
            const snakeBarWidth = Math.max(15, (logSnake / maxLog) * 100);
            const cellBarWidth = Math.max(15, (logCell / maxLog) * 100);
            const foodBarWidth = Math.max(15, (logFood / maxLog) * 100);

            // DOM 渲染長條圖
            setTimeout(() => {
                document.getElementById('snakeBar').style.width = `${snakeBarWidth}%`;
                document.getElementById('cellBar').style.width = `${cellBarWidth}%`;
                document.getElementById('foodBar').style.width = `${foodBarWidth}%`;
            }, 100);

            document.getElementById('aromaText').innerText = aroma;
            document.getElementById('michelinComment').innerText = comment;

            // 顯示結果面板並滾動
            const resultBox = document.getElementById('resultContainer');
            resultBox.classList.remove('hidden');
            resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // 繪製與下載 高清 PNG 卡片 (原生 Canvas 技術)
        function downloadResultCard() {
            if (!globalDetectData) return;

            const canvas = document.getElementById('exportCanvas');
            const ctx = canvas.getContext('2d');

            // 1. 設定高清解析度 800 x 1150
            canvas.width = 800;
            canvas.height = 1150;

            // 背景天空漸層
            const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGradient.addColorStop(0, '#70d6ff');
            bgGradient.addColorStop(0.5, '#e7c6ff');
            bgGradient.addColorStop(1, '#7bf1a8');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 白色結果卡片主體
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.roundRect(40, 50, 720, 1050, 30);
            ctx.fill();
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#f472b6';
            ctx.stroke();

            // 標題
            ctx.fillStyle = '#db2777';
            ctx.font = 'bold 38px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`🌸 ${globalDetectData.name} 的皮炎宇宙探測報告 🌸`, 400, 120);

            ctx.fillStyle = '#6b7280';
            ctx.font = 'bold 20px sans-serif';
            ctx.fillText(`生日: ${globalDetectData.birthday} ‧ 陽光彩虹獨家認證`, 400, 160);

            // 幾何數據 (直徑 & 深度)
            ctx.fillStyle = '#fce7f3';
            ctx.roundRect(70, 190, 310, 120, 20);
            ctx.fill();
            ctx.fillStyle = '#db2777';
            ctx.font = 'bold 20px sans-serif';
            ctx.fillText('皮炎直徑大小', 225, 225);
            ctx.font = 'black 36px sans-serif';
            ctx.fillText(`${globalDetectData.diameter} cm`, 225, 270);

            ctx.fillStyle = '#f3e8ff';
            ctx.roundRect(420, 190, 310, 120, 20);
            ctx.fill();
            ctx.fillStyle = '#7e22ce';
            ctx.font = 'bold 20px sans-serif';
            ctx.fillText('皮炎探測深度', 575, 225);
            ctx.font = 'black 36px sans-serif';
            ctx.fillText(`${globalDetectData.depth} cm`, 575, 270);

            // 構造成分 (對數長條圖)
            ctx.textAlign = 'left';
            ctx.fillStyle = '#374151';
            ctx.font = 'bold 24px sans-serif';
            ctx.fillText('📊 構造成分 (對數歸一化比例)', 70, 360);

            // 巨蟒
            ctx.font = 'bold 18px sans-serif';
            ctx.fillText(`💩 黃金巨蟒 (屎): ${globalDetectData.snakeKg} kg`, 70, 400);
            ctx.fillStyle = '#e5e7eb';
            ctx.roundRect(70, 410, 660, 20, 10);
            ctx.fill();
            ctx.fillStyle = '#d97706';
            ctx.roundRect(70, 410, Math.max(50, (Math.log10(parseFloat(globalDetectData.snakeKg)*100+1) / 9) * 660), 20, 10);
            ctx.fill();

            // 細胞
            ctx.fillStyle = '#374151';
            ctx.fillText(`🦠 脫落的大腸細胞: ${globalDetectData.cellCount.toLocaleString()} 個`, 70, 465);
            ctx.fillStyle = '#e5e7eb';
            ctx.roundRect(70, 475, 660, 20, 10);
            ctx.fill();
            ctx.fillStyle = '#059669';
            ctx.roundRect(70, 475, Math.max(50, (Math.log10(globalDetectData.cellCount+1) / 9) * 660), 20, 10);
            ctx.fill();

            // 食物殘渣
            ctx.fillStyle = '#374151';
            ctx.fillText(`🍲 食物殘渣 (${globalDetectData.foodName}): ${globalDetectData.foodCount} 粒`, 70, 530);
            ctx.fillStyle = '#e5e7eb';
            ctx.roundRect(70, 540, 660, 20, 10);
            ctx.fill();
            ctx.fillStyle = '#ea580c';
            ctx.roundRect(70, 540, Math.max(50, (Math.log10(globalDetectData.foodCount+1) / 9) * 660), 20, 10);
            ctx.fill();

            // 情緒味道調性
            ctx.fillStyle = '#fffbeb';
            ctx.roundRect(70, 590, 660, 170, 20);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#fcd34d';
            ctx.stroke();

            ctx.fillStyle = '#b45309';
            ctx.font = 'bold 22px sans-serif';
            ctx.fillText('👃 皮炎情緒風味調性', 90, 630);

            ctx.fillStyle = '#78350f';
            ctx.font = '18px sans-serif';
            wrapText(ctx, globalDetectData.aroma, 90, 670, 620, 28);

            // 米其林評語
            ctx.fillStyle = '#faf5ff';
            ctx.roundRect(70, 780, 660, 220, 20);
            ctx.fill();
            ctx.strokeStyle = '#e9d5ff';
            ctx.stroke();

            ctx.fillStyle = '#6b21a8';
            ctx.font = 'bold 22px sans-serif';
            ctx.fillText('🍽️ 米其林三星評審特評', 90, 820);

            ctx.fillStyle = '#581c87';
            ctx.font = 'italic 18px sans-serif';
            wrapText(ctx, globalDetectData.comment, 90, 860, 620, 28);

            // 頁尾
            ctx.fillStyle = '#9ca3af';
            ctx.font = 'bold 18px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('🌈 皮炎裡的世界 ‧ 陽光綠地彩虹探測網頁 🌈', 400, 1060);

            // 導出 PNG 圖片
            try {
                canvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `皮炎裡的世界_${globalDetectData.name}.png`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);

                    // 手機端備用彈窗降級機制
                    document.getElementById('modalImg').src = url;
                }, 'image/png');
            } catch (err) {
                // 若被安全性阻擋則開啟圖片彈窗供長按下載
                openModal();
            }
        }

        // Canvas 換行輔助函式
        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            const words = text.split('');
            let line = '';
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n];
                let metrics = ctx.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    ctx.fillText(line, x, y);
                    line = words[n];
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, y);
        }

        // 複製文字報告
        function copyShareText() {
            if (!globalDetectData) return;
            const text = `【皮炎裡的世界】探測報告出爐！\n👤 姓名：${globalDetectData.name}\n📏 直徑：${globalDetectData.diameter} cm (${globalDetectData.diameterRef})\n🕳️ 深度：${globalDetectData.depth} cm (${globalDetectData.depthRef})\n💩 黃金巨蟒：${globalDetectData.snakeKg} kg\n🦠 大腸細胞：${globalDetectData.cellCount.toLocaleString()} 個\n🍲 食物殘渣：${globalDetectData.foodName} (${globalDetectData.foodCount} 粒)\n👃 風味：${globalDetectData.aroma}\n🍽️ 米其林評語：${globalDetectData.comment}`;
            
            navigator.clipboard.writeText(text).then(() => {
                alert('已成功複製完整的皮炎生態文字報告！');
            }).catch(() => {
                alert('複製失敗，請手動截圖分享！');
            });
        }

        function openModal() {
            document.getElementById('imageModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('imageModal').classList.add('hidden');
        }
    </script>
